<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Week iCBT Social Anxiety Program</title>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-surface: #ffffff;
            --bg-sidebar: #0f172a;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --accent-border: #bfdbfe;
            --success: #10b981;
            --success-light: #ecfdf5;
            --warning: #f59e0b;
            --warning-light: #fffbeb;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
        }

        .dark-mode {
            --bg-primary: #090d16;
            --bg-surface: #1e293b;
            --bg-sidebar: #020617;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border: #334155;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --accent-light: #1e3a8a;
            --accent-border: #1e40af;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar Styling */
        #sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            box-shadow: var(--shadow-lg);
            z-index: 20;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .program-progress {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-bar-bg {
            height: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #10b981);
            width: 0%;
            transition: width 0.4s ease;
        }

        .session-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            padding: 0.75rem;
        }

        .session-item {
            padding: 0.875rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: transparent;
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid transparent;
        }

        .session-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #f1f5f9;
        }

        .session-item.active {
            background-color: var(--accent);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .session-item.completed .session-badge {
            background-color: #10b981;
            color: #ffffff;
        }

        .session-badge {
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
        }

        /* Main Content Layout */
        #main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }

        header {
            background-color: var(--bg-surface);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header-title p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.5rem 0.875rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .theme-toggle:hover {
            background-color: var(--accent-light);
        }

        /* Step Navigation Header */
        .step-nav {
            display: flex;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            overflow-x: auto;
        }

        .step-tab {
            padding: 1rem 1.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border-bottom: 3px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .step-tab:hover {
            color: var(--accent);
        }

        .step-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .step-tab.done {
            color: var(--success);
        }

        .step-number {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background-color: var(--border);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        .step-tab.active .step-number {
            background-color: var(--accent);
            color: white;
        }

        .step-tab.done .step-number {
            background-color: var(--success);
            color: white;
        }

        /* Content Area */
        .content-container {
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        .card {
            background-color: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1.25rem;
            line-height: 1.5;
        }

        /* Form & Interactive Elements */
        .slider-group {
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .slider-group:last-child {
            border-bottom: none;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .slider-val {
            color: var(--accent);
            font-weight: 700;
        }

        .slider-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            outline: none;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* Live Score Cards */
        .score-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .score-card {
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: var(--radius-md);
            text-align: center;
        }

        .score-card h4 {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .score-card .score-val {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--accent);
        }

        .badge-severity {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 0.25rem;
        }

        .badge-minimal { background: var(--success-light); color: var(--success); }
        .badge-mild { background: #e0f2fe; color: #0284c7; }
        .badge-marked { background: var(--warning-light); color: var(--warning); }
        .badge-severe { background: var(--danger-light); color: var(--danger); }

        /* Chips & Checkboxes */
        .chip-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .chip {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            background-color: var(--bg-primary);
            color: var(--text-secondary);
            font-size: 0.875rem;
            cursor: pointer;
            user-select: none;
        }

        .chip:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .chip.selected {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 0.75rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem;
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.9rem;
        }

        .checkbox-item input {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
        }

        /* Input Controls */
        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.95rem;
            margin-top: 0.35rem;
            margin-bottom: 1rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        /* Navigation Buttons */
        .btn-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-secondary {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: var(--bg-primary);
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Distortion Selector */
        .distortion-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .distortion-card {
            border: 1px solid var(--border);
            padding: 0.875rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            background-color: var(--bg-primary);
        }

        .distortion-card.selected {
            border-color: var(--accent);
            background-color: var(--accent-light);
        }

        .distortion-card h5 {
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
        }

        .distortion-card p {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            #sidebar {
                width: 100%;
                height: auto;
                max-height: 250px;
            }
            #main-wrapper {
                height: auto;
            }
            .step-nav {
                padding: 0 1rem;
            }
            .content-container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <h2>🧠 iCBT Roadmap</h2>
        </div>
        <div class="program-progress">
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
                <span>Program Progress</span>
                <span id="progress-text">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
        <ul class="session-list" id="session-list">
            <!-- Dynamic session list generated by JS -->
        </ul>
    </aside>

    <!-- Main App Container -->
    <div id="main-wrapper">
        <header>
            <div class="header-title">
                <h1 id="session-header-title">Session 1: Understanding Social Anxiety & Triggers</h1>
                <p id="session-header-subtitle">Module 1 of 8 • Internet-delivered Cognitive Behavioral Therapy</p>
            </div>
            <button class="theme-toggle" id="theme-toggle">🌙 Dark Mode</button>
        </header>

        <!-- Top Step Indicator Header -->
        <nav class="step-nav" id="step-nav">
            <div class="step-tab active" data-step="1">
                <span class="step-number">1</span> Screener
            </div>
            <div class="step-tab" data-step="2">
                <span class="step-number">2</span> Psychoeducation
            </div>
            <div class="step-tab" data-step="3">
                <span class="step-number">3</span> Thought Record
            </div>
            <div class="step-tab" data-step="4">
                <span class="step-number">4</span> Action Planner
            </div>
        </nav>

        <!-- Dynamic Content Body -->
        <main class="content-container" id="content-area">
            <!-- Rendered by JS based on current active session & step -->
        </main>
    </div>

    <script>
        // Data Structure for the 8 Program Sessions
        const programData = [
            {
                id: 1,
                title: "Session 1: Understanding Social Anxiety & Triggers",
                subtitle: "Deconstruct your social anxiety cycle, identify triggers, and map somatic responses.",
                psychoeducation: {
                    title: "The Cognitive Behavioral Model of Social Anxiety",
                    text: "Social anxiety is maintained through a reinforcing loop: a trigger situation activates negative automatic thoughts, leading to physical anxiety symptoms and safety behaviors. By recognizing these triggers and symptoms early, we can break the cycle.",
                    triggers: ["Public speaking", "Small talk with acquaintances", "Eating or drinking in public", "Attending parties", "Speaking to authority figures", "Expressing disagreement", "Making phone calls", "Entering a crowded room"],
                    somatics: ["Rapid heart rate", "Blushing", "Sweating", "Muscle tension", "Shaky hands / voice", "Nausea or stomach distress", "Dry mouth", "Mind going blank"]
                }
            },
            {
                id: 2,
                title: "Session 2: Identifying & Challenging Automatic Thoughts",
                subtitle: "Learn to catch negative automatic thoughts (NATs) and spot cognitive distortions.",
                psychoeducation: {
                    title: "Catching Negative Automatic Thoughts (NATs)",
                    text: "In social situations, our brain often jumps to instant, unhelpful interpretations called Automatic Thoughts. These thoughts happen so quickly they feel like absolute facts, but they are often filtered through cognitive distortions.",
                    triggers: ["Unplanned encounters", "Performance reviews", "Group discussions", "Asking for help", "Being watched while working"],
                    somatics: ["Shallow breathing", "Feeling hot/flushed", "Dizziness", "Tight chest", "Restlessness"]
                }
            },
            {
                id: 3,
                title: "Session 3: Cognitive Restructuring & Thought Records",
                subtitle: "Master evidence-based reasoning to build balanced, realistic perspectives.",
                psychoeducation: {
                    title: "Evaluating Evidence For and Against",
                    text: "Cognitive restructuring isn't just 'positive thinking'—it's realistic, objective thinking. Put your automatic thoughts on trial by systematically comparing actual facts against assumptions.",
                    triggers: ["Receiving feedback", "Introducing yourself", "Making mistakes in public", "Walking into a meeting late"],
                    somatics: ["Heart palpitations", "Sweaty palms", "Stomach knots", "Trembling"]
                }
            },
            {
                id: 4,
                title: "Session 4: Building an Exposure Hierarchy",
                subtitle: "Design a step-by-step graded ladder to face social situations systematically.",
                psychoeducation: {
                    title: "Graded Exposure & Systematic Desensitization",
                    text: "Avoidance keeps social fear alive. By gradually facing feared situations ranked by difficulty (Subjective Units of Distress / SUDs from 0–100), your nervous system naturally habituates and learns that dreaded outcomes rarely occur.",
                    triggers: ["Making eye contact", "Ordering food at a counter", "Asking a clerk for assistance", "Hosting a gathering"],
                    somatics: ["Gasping for air", "Blushing", "Voice trembling", "Internal jitteriness"]
                }
            },
            {
                id: 5,
                title: "Session 5: Facing Feared Social Situations (In-Vivo Exposure)",
                subtitle: "Execute behavioral experiments in real life and track anxiety reduction.",
                psychoeducation: {
                    title: "Conducting Behavioral Experiments",
                    text: "In-vivo (real life) exposures test your predictions directly. The goal is not to eliminate anxiety completely, but to remain in the situation long enough for your distress to naturally drop.",
                    triggers: ["Intentionally making minor mistakes", "Asking for directions", "Holding a conversation for 5 mins", "Sitting in front row"],
                    somatics: ["Sweating", "Elevated pulse", "Tight shoulders", "Gastrointestinal distress"]
                }
            },
            {
                id: 6,
                title: "Session 6: Eliminating Safety Behaviors & Self-Focus",
                subtitle: "Shift focus outward and drop subtle coping habits that prolong anxiety.",
                psychoeducation: {
                    title: "Dropping Safety Behaviors & Internal Spotlight",
                    text: "Safety behaviors (e.g., rehearsing lines mentally, avoiding eye contact, gripping a cup tightly) create a false sense of security while keeping self-focus dangerously high. Dropping them builds genuine social confidence.",
                    triggers: ["Mingling at events", "Unstructured social gatherings", "Being asked unexpected questions"],
                    somatics: ["Self-conscious bodily awareness", "Feeling faint", "Rigid posture"]
                }
            },
            {
                id: 7,
                title: "Session 7: Core Beliefs & Social Self-Esteem",
                subtitle: "Identify deep-seated assumptions and cultivate a resilient self-schema.",
                psychoeducation: {
                    title: "Modifying Core Schema",
                    text: "Automatic thoughts stem from deeper core beliefs (e.g., 'I am inadequate', 'People are inherently judgmental'). We can rewrite these underlying beliefs by nurturing self-compassion and realistic self-worth.",
                    triggers: ["Handling rejection or criticism", "Asserting boundaries", "Sharing personal opinions"],
                    somatics: ["Deep slump in posture", "Heavy chest feeling", "Chronic tension"]
                }
            },
            {
                id: 8,
                title: "Session 8: Relapse Prevention & Long-Term Mastery",
                subtitle: "Consolidate your CBT toolkit, anticipate setbacks, and maintain momentum.",
                psychoeducation: {
                    title: "Maintaining Long-Term Social Mastery",
                    text: "Setbacks are a normal part of growth, not a failure. Maintain your progress by continuing regular exposures, practicing periodic thought records, and viewing challenges as learning opportunities.",
                    triggers: ["New job/environment", "Major life transitions", "Periods of high overall stress"],
                    somatics: ["Mild stress response", "Temporary surge in tension"]
                }
            }
        ];

        // 10 Standard Questions for the Pre-Session Distress Screener
        const screenerQuestions = [
            { id: 'q1', text: '1. Fear of Scrutiny / Being Observed by Others', desc: 'Distress when being watched while working, walking, or writing.', category: 'fear' },
            { id: 'q2', text: '2. Fear of Negative Evaluation or Disapproval', desc: 'Worrying that others judge you as foolish, awkward, or boring.', category: 'fear' },
            { id: 'q3', text: '3. Anxiety Speaking in Public / Group Settings', desc: 'Discomfort when addressing meetings, classes, or presentations.', category: 'fear' },
            { id: 'q4', text: '4. Discomfort Eating or Drinking in Social Settings', desc: 'Self-consciousness when dining around peers or strangers.', category: 'fear' },
            { id: 'q5', text: '5. Dread of Meeting Strangers or Unfamiliar People', desc: 'Nervousness when introducing yourself or starting small talk.', category: 'fear' },
            { id: 'q6', text: '6. Somatic Symptoms (Blushing, Sweating, Shaking)', desc: 'Intensity of physical reactions during social encounters.', category: 'somatic' },
            { id: 'q7', text: '7. Anticipatory Anxiety Prior to Social Events', desc: 'Dread and nervousness experienced days/hours before events.', category: 'somatic' },
            { id: 'q8', text: '8. Urge to Avoid Social or Performance Situations', desc: 'Frequency of escaping or declining social opportunities.', category: 'avoidance' },
            { id: 'q9', text: '9. Uncomfortableness Being the Center of Attention', desc: 'Distress when focus or conversation shifts toward you.', category: 'fear' },
            { id: 'q10', text: '10. Social & Occupational Life Interference', desc: 'Degree to which social fear limits your career or personal goals.', category: 'avoidance' }
        ];

        // App State
        let state = {
            currentSession: 1,
            currentStep: 1,
            completedSessions: {},
            sessionData: {}
        };

        // Load persisted state from LocalStorage
        function loadStorage() {
            try {
                const saved = localStorage.getItem('iCBT_Social_Anxiety_Data');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state.completedSessions = parsed.completedSessions || {};
                    state.sessionData = parsed.sessionData || {};
                }
            } catch (e) {
                console.error('LocalStorage load error:', e);
            }
        }

        // Save current state to LocalStorage
        function saveStorage() {
            try {
                localStorage.setItem('iCBT_Social_Anxiety_Data', JSON.stringify({
                    completedSessions: state.completedSessions,
                    sessionData: state.sessionData
                }));
            } catch (e) {
                console.error('LocalStorage save error:', e);
            }
        }

        // Initialize state structure for a session if missing
        function ensureSessionState(sessionId) {
            if (!state.sessionData[sessionId]) {
                state.sessionData[sessionId] = {
                    screener: { q1: 50, q2: 50, q3: 50, q4: 30, q5: 40, q6: 50, q7: 60, q8: 40, q9: 60, q10: 40 },
                    selectedTriggers: [],
                    selectedSomatics: [],
                    thoughtRecord: { situation: '', thought: '', distortion: 'Mind Reading', evidenceFor: '', evidenceAgainst: '', initialBelief: 80, newBelief: 30 },
                    actionPlanner: { task: '', suds: 50, targetDate: '', status: 'Pending' }
                };
            }
        }

        // Update overall progress bar
        function updateProgressBar() {
            const completedCount = Object.keys(state.completedSessions).filter(k => state.completedSessions[k]).length;
            const percentage = Math.round((completedCount / 8) * 100);
            document.getElementById('progress-fill').style.width = `${percentage}%`;
            document.getElementById('progress-text').innerText = `${percentage}% Completed`;
        }

        // Render Sidebar Session Navigation
        function renderSidebar() {
            const listEl = document.getElementById('session-list');
            listEl.innerHTML = '';

            programData.forEach(session => {
                const li = document.createElement('li');
                const isCompleted = !!state.completedSessions[session.id];
                const isActive = session.id === state.currentSession;

                li.className = `session-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}`;
                li.onclick = () => switchSession(session.id);

                li.innerHTML = `
                    <span>S${session.id}: ${session.title.split(':')[1].trim()}</span>
                    <span class="session-badge">${isCompleted ? '✓ Done' : `W${session.id}`}</span>
                `;
                listEl.appendChild(li);
            });

            updateProgressBar();
        }

        // Render Top Step Bar
        function renderStepNav() {
            const tabs = document.querySelectorAll('.step-tab');
            tabs.forEach(tab => {
                const stepNum = parseInt(tab.getAttribute('data-step'));
                tab.classList.remove('active', 'done');
                if (stepNum === state.currentStep) {
                    tab.classList.add('active');
                } else if (stepNum < state.currentStep) {
                    tab.classList.add('done');
                }
                tab.onclick = () => switchStep(stepNum);
            });
        }

        // Switch Active Session
        function switchSession(sessionId) {
            state.currentSession = sessionId;
            state.currentStep = 1;
            ensureSessionState(sessionId);
            
            const curr = programData.find(s => s.id === sessionId);
            document.getElementById('session-header-title').innerText = curr.title;
            document.getElementById('session-header-subtitle').innerText = curr.subtitle;

            renderSidebar();
            renderStepNav();
            renderStepContent();
        }

        // Switch Active Step
        function switchStep(stepNum) {
            state.currentStep = stepNum;
            renderStepNav();
            renderStepContent();
        }

        // Main Content View Router
        function renderStepContent() {
            ensureSessionState(state.currentSession);
            const container = document.getElementById('content-area');

            if (state.currentStep === 1) {
                renderStep1Screener(container);
            } else if (state.currentStep === 2) {
                renderStep2Psychoed(container);
            } else if (state.currentStep === 3) {
                renderStep3ThoughtRecord(container);
            } else if (state.currentStep === 4) {
                renderStep4ActionPlanner(container);
            }
        }

        // STEP 1: Pre-Session 10-Question Social Distress Screener
        function renderStep1Screener(container) {
            const screenerState = state.sessionData[state.currentSession].screener;

            let html = `
                <div class="card">
                    <h3 class="card-title">📊 Pre-Session Social Distress Assessment</h3>
                    <p class="card-subtitle">Adjust the sliders (0% to 100%) to indicate your current level of distress or discomfort across these ten core social parameters.</p>
                    
                    <div id="screener-sliders">
            `;

            screenerQuestions.forEach(q => {
                const val = screenerState[q.id] || 0;
                html += `
                    <div class="slider-group">
                        <div class="slider-header">
                            <span>${q.text}</span>
                            <span class="slider-val" id="val-${q.id}">${val}%</span>
                        </div>
                        <div class="slider-desc">${q.desc}</div>
                        <input type="range" min="0" max="100" value="${val}" oninput="updateScreenerVal('${q.id}', this.value)">
                    </div>
                `;
            });

            html += `
                    </div>
                </div>

                <div class="card">
                    <h3 class="card-title">📈 Real-Time Subscale Analysis</h3>
                    <div class="score-grid">
                        <div class="score-card">
                            <h4>Fear Subscale</h4>
                            <div class="score-val" id="score-fear">0%</div>
                        </div>
                        <div class="score-card">
                            <h4>Avoidance Subscale</h4>
                            <div class="score-val" id="score-avoidance">0%</div>
                        </div>
                        <div class="score-card">
                            <h4>Somatic Subscale</h4>
                            <div class="score-val" id="score-somatic">0%</div>
                        </div>
                        <div class="score-card">
                            <h4>Overall Distress</h4>
                            <div class="score-val" id="score-total">0%</div>
                            <div id="badge-severity" class="badge-severity badge-minimal">Minimal</div>
                        </div>
                    </div>
                </div>

                <div class="btn-footer">
                    <button class="btn btn-secondary" disabled>Previous Step</button>
                    <button class="btn btn-primary" onclick="switchStep(2)">Proceed to Psychoeducation →</button>
                </div>
            `;

            container.innerHTML = html;
            calculateSubscales();
        }

        // Helper: Update Screener Slider Value
        window.updateScreenerVal = function(qId, val) {
            state.sessionData[state.currentSession].screener[qId] = parseInt(val);
            document.getElementById(`val-${qId}`).innerText = `${val}%`;
            calculateSubscales();
            saveStorage();
        };

        // Helper: Calculate Subscale Scores and Overall Severity
        function calculateSubscales() {
            const screenerState = state.sessionData[state.currentSession].screener;
            let fearSum = 0, fearCount = 0;
            let avoidanceSum = 0, avoidanceCount = 0;
            let somaticSum = 0, somaticCount = 0;
            let totalSum = 0;

            screenerQuestions.forEach(q => {
                const val = screenerState[q.id] || 0;
                totalSum += val;
                if (q.category === 'fear') { fearSum += val; fearCount++; }
                if (q.category === 'avoidance') { avoidanceSum += val; avoidanceCount++; }
                if (q.category === 'somatic') { somaticSum += val; somaticCount++; }
            });

            const fearAvg = Math.round(fearSum / fearCount);
            const avoidanceAvg = Math.round(avoidanceSum / avoidanceCount);
            const somaticAvg = Math.round(somaticSum / somaticCount);
            const totalAvg = Math.round(totalSum / 10);

            if (document.getElementById('score-fear')) {
                document.getElementById('score-fear').innerText = `${fearAvg}%`;
                document.getElementById('score-avoidance').innerText = `${avoidanceAvg}%`;
                document.getElementById('score-somatic').innerText = `${somaticAvg}%`;
                document.getElementById('score-total').innerText = `${totalAvg}%`;

                const badge = document.getElementById('badge-severity');
                badge.className = 'badge-severity ';
                if (totalAvg < 25) {
                    badge.innerText = 'Minimal';
                    badge.classList.add('badge-minimal');
                } else if (totalAvg < 50) {
                    badge.innerText = 'Mild';
                    badge.classList.add('badge-mild');
                } else if (totalAvg < 75) {
                    badge.innerText = 'Marked';
                    badge.classList.add('badge-marked');
                } else {
                    badge.innerText = 'Severe';
                    badge.classList.add('badge-severe');
                }
            }
        }

        // STEP 2: Psychoeducation & Trigger Mapping
        function renderStep2Psychoed(container) {
            const currSession = programData.find(s => s.id === state.currentSession);
            const pData = currSession.psychoeducation;
            const sessionStore = state.sessionData[state.currentSession];

            let html = `
                <div class="card">
                    <h3 class="card-title">📖 ${pData.title}</h3>
                    <p class="card-subtitle">${pData.text}</p>
                </div>

                <div class="card">
                    <h3 class="card-title">🎯 Key Triggers Selector</h3>
                    <p class="card-subtitle">Select the specific situations that activate your social anxiety during this phase of the program:</p>
                    <div class="chip-container">
            `;

            pData.triggers.forEach(trig => {
                const isSel = sessionStore.selectedTriggers.includes(trig);
                html += `
                    <div class="chip ${isSel ? 'selected' : ''}" onclick="toggleTrigger('${trig.replace(/'/g, "\\'")}')">
                        ${isSel ? '✓ ' : '+ '}${trig}
                    </div>
                `;
            });

            html += `
                    </div>
                </div>

                <div class="card">
                    <h3 class="card-title">⚡ Somatic Symptoms Mapping</h3>
                    <p class="card-subtitle">Which physical sensations do you experience most acutely?</p>
                    <div class="checkbox-grid">
            `;

            pData.somatics.forEach(somatic => {
                const isChecked = sessionStore.selectedSomatics.includes(somatic);
                html += `
                    <label class="checkbox-item">
                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleSomatic('${somatic.replace(/'/g, "\\'")}')">
                        ${somatic}
                    </label>
                `;
            });

            html += `
                    </div>
                </div>

                <div class="btn-footer">
                    <button class="btn btn-secondary" onclick="switchStep(1)">← Back to Screener</button>
                    <button class="btn btn-primary" onclick="switchStep(3)">Proceed to Thought Record →</button>
                </div>
            `;

            container.innerHTML = html;
        }

        // Trigger Selector Toggle
        window.toggleTrigger = function(trig) {
            const trigs = state.sessionData[state.currentSession].selectedTriggers;
            const idx = trigs.indexOf(trig);
            if (idx > -1) trigs.splice(idx, 1);
            else trigs.push(trig);
            saveStorage();
            renderStep2Psychoed(document.getElementById('content-area'));
        };

        // Somatic Checkbox Toggle
        window.toggleSomatic = function(somatic) {
            const somatics = state.sessionData[state.currentSession].selectedSomatics;
            const idx = somatics.indexOf(somatic);
            if (idx > -1) somatics.splice(idx, 1);
            else somatics.push(somatic);
            saveStorage();
        };

        // STEP 3: CBT Thought Record Wizard
        function renderStep3ThoughtRecord(container) {
            const tr = state.sessionData[state.currentSession].thoughtRecord;

            const distortions = [
                { title: 'Mind Reading', desc: 'Assuming others are judging or viewing you negatively without proof.' },
                { title: 'Catastrophizing', desc: 'Expecting the absolute worst case scenario will occur.' },
                { title: 'All-or-Nothing', desc: 'Viewing performance as a total failure unless perfect.' },
                { title: 'Emotional Reasoning', desc: 'Believing that feeling anxious implies you are in real danger.' }
            ];

            let html = `
                <div class="card">
                    <h3 class="card-title">📝 Interactive CBT Thought Record Wizard</h3>
                    <p class="card-subtitle">Deconstruct unhelpful automatic thoughts by testing objective evidence and formulating balanced alternative thoughts.</p>
                    
                    <label>1. Social Trigger Situation</label>
                    <input type="text" class="form-control" placeholder="e.g., Giving a status update in a team meeting" value="${tr.situation}" onchange="updateTR('situation', this.value)">

                    <label>2. Automatic Negative Thought (NAT)</label>
                    <input type="text" class="form-control" placeholder="e.g., Everyone will notice my voice shaking and think I am incompetent" value="${tr.thought}" onchange="updateTR('thought', this.value)">

                    <label>3. Identify Cognitive Distortion</label>
                    <div class="distortion-grid" style="margin-top:0.5rem;">
            `;

            distortions.forEach(d => {
                const isSel = tr.distortion === d.title;
                html += `
                    <div class="distortion-card ${isSel ? 'selected' : ''}" onclick="selectDistortion('${d.title}')">
                        <h5>${d.title}</h5>
                        <p>${d.desc}</p>
                    </div>
                `;
            });

            html += `
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top:1rem;">
                        <div>
                            <label>4. Evidence FOR the Thought</label>
                            <textarea class="form-control" rows="3" placeholder="Factual facts supporting this thought..." onchange="updateTR('evidenceFor', this.value)">${tr.evidenceFor}</textarea>
                        </div>
                        <div>
                            <label>5. Evidence AGAINST the Thought</label>
                            <textarea class="form-control" rows="3" placeholder="Facts that contradict or soften this thought..." onchange="updateTR('evidenceAgainst', this.value)">${tr.evidenceAgainst}</textarea>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top:0.5rem;">
                        <div class="slider-group">
                            <div class="slider-header">
                                <span>Initial Belief Strength</span>
                                <span class="slider-val" id="val-init-belief">${tr.initialBelief}%</span>
                            </div>
                            <input type="range" min="0" max="100" value="${tr.initialBelief}" oninput="updateTR('initialBelief', this.value); document.getElementById('val-init-belief').innerText = this.value + '%';">
                        </div>

                        <div class="slider-group">
                            <div class="slider-header">
                                <span>Re-rated Belief Strength</span>
                                <span class="slider-val" id="val-new-belief">${tr.newBelief}%</span>
                            </div>
                            <input type="range" min="0" max="100" value="${tr.newBelief}" oninput="updateTR('newBelief', this.value); document.getElementById('val-new-belief').innerText = this.value + '%';">
                        </div>
                    </div>
                </div>

                <div class="btn-footer">
                    <button class="btn btn-secondary" onclick="switchStep(2)">← Back to Psychoed</button>
                    <button class="btn btn-primary" onclick="switchStep(4)">Proceed to Action Planner →</button>
                </div>
            `;

            container.innerHTML = html;
        }

        // Helper: Update Thought Record Field
        window.updateTR = function(field, val) {
            state.sessionData[state.currentSession].thoughtRecord[field] = val;
            saveStorage();
        };

        // Helper: Select Distortion
        window.selectDistortion = function(title) {
            state.sessionData[state.currentSession].thoughtRecord.distortion = title;
            saveStorage();
            renderStep3ThoughtRecord(document.getElementById('content-area'));
        };

        // STEP 4: Behavioral Homework & Exposure Action Planner
        function renderStep4ActionPlanner(container) {
            const ap = state.sessionData[state.currentSession].actionPlanner;
            const isSessionDone = !!state.completedSessions[state.currentSession];

            let html = `
                <div class="card">
                    <h3 class="card-title">🚀 Behavioral Exposure Action Planner</h3>
                    <p class="card-subtitle">Assign a real-world behavioral experiment or exposure exercise to consolidate your learning before the next session.</p>

                    <label>Exposure Experiment Task</label>
                    <input type="text" class="form-control" placeholder="e.g., Ask a store cashier for a product recommendation without rehearsing" value="${ap.task}" onchange="updateAP('task', this.value)">

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="slider-group">
                            <div class="slider-header">
                                <span>Target Distress (SUDs 0-100)</span>
                                <span class="slider-val" id="val-suds">${ap.suds}</span>
                            </div>
                            <input type="range" min="0" max="100" value="${ap.suds}" oninput="updateAP('suds', this.value); document.getElementById('val-suds').innerText = this.value;">
                        </div>

                        <div>
                            <label>Target Completion Date</label>
                            <input type="date" class="form-control" value="${ap.targetDate}" onchange="updateAP('targetDate', this.value)">
                        </div>
                    </div>
                </div>

                <div class="card" style="text-align: center; padding: 2rem;">
                    <h3 class="card-title" style="justify-content: center;">🎉 Session Completion Status</h3>
                    <p class="card-subtitle">Mark this session as complete to record your progress and unlock the next module.</p>
                    
                    <button class="btn ${isSessionDone ? 'btn-success' : 'btn-primary'}" style="font-size: 1.1rem; padding: 0.875rem 2rem;" onclick="toggleSessionComplete()">
                        ${isSessionDone ? '✓ Session Completed (Click to Undo)' : 'Mark Session Complete & Save'}
                    </button>
                </div>

                <div class="btn-footer">
                    <button class="btn btn-secondary" onclick="switchStep(3)">← Back to Thought Record</button>
                    ${state.currentSession < 8 ? `
                        <button class="btn btn-primary" onclick="switchSession(${state.currentSession + 1})">Advance to Next Session →</button>
                    ` : `
                        <button class="btn btn-success" disabled>🎉 Full Roadmap Completed!</button>
                    `}
                </div>
            `;

            container.innerHTML = html;
        }

        // Helper: Update Action Planner Field
        window.updateAP = function(field, val) {
            state.sessionData[state.currentSession].actionPlanner[field] = val;
            saveStorage();
        };

        // Mark Session Complete / Incomplete
        window.toggleSessionComplete = function() {
            const current = state.currentSession;
            state.completedSessions[current] = !state.completedSessions[current];
            saveStorage();
            renderSidebar();
            renderStep4ActionPlanner(document.getElementById('content-area'));
        };

        // Theme Toggle Handler
        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('theme-toggle').innerText = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
        });

        // Initialize App
        window.onload = function() {
            loadStorage();
            ensureSessionState(state.currentSession);
            renderSidebar();
            renderStepNav();
            renderStepContent();
        };
    </script>
</body>
</html>
